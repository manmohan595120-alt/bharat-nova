<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071b35">
<meta name="description" content="Bharat Nova Smart Search and AI Assistant">
<title>Bharat Nova</title>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #071b35;
  color: white;
}
header {
  text-align: center;
  padding: 24px 12px;
  background: #102b50;
}
main {
  max-width: 700px;
  margin: auto;
  padding: 15px;
}
.card {
  background: #102b50;
  padding: 18px;
  margin-bottom: 18px;
  border-radius: 14px;
  border: 1px solid #294a70;
}
h2 { margin-top: 0; }
input, button {
  width: 100%;
  padding: 13px;
  margin: 7px 0;
  border-radius: 8px;
  font-size: 16px;
}
input {
  background: white;
  color: #111827;
  border: 1px solid #bbb;
}
button {
  border: 0;
  background: #1677ff;
  color: white;
  font-weight: bold;
  cursor: pointer;
}
button:disabled { opacity: .6; }
.green { background: #16845b; }
.purple { background: #7848d8; }
.red { background: #b83245; }
.gray { background: #42536a; }
.status {
  padding: 12px;
  background: #071b35;
  border-radius: 8px;
  margin-top: 10px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.small { font-size: 13px; line-height: 1.6; color: #d0dced; }
.hidden { display: none !important; }
.user {
  background: #071b35;
  padding: 12px;
  border-radius: 8px;
  margin: 10px 0;
  overflow-wrap: anywhere;
}
footer {
  text-align: center;
  padding: 20px;
  color: #cbd5e1;
}
</style>
</head>

<body>
<header>
  <h1>🇮🇳 Bharat Nova</h1>
  <p>Smart Search • AI Assistant</p>
</header>

<main>
  <section class="card">
    <h2>🔎 Google Search</h2>
    <form id="searchForm">
      <input id="searchInput" placeholder="कुछ भी खोजें..." required>
      <button type="submit">Google पर खोजें</button>
    </form>
    <button id="youtubeBtn" class="red" type="button">▶ YouTube Search</button>
    <button id="wikiBtn" class="green" type="button">📚 Wikipedia Search</button>
    <button id="voiceBtn" class="purple" type="button">🎤 Voice Search</button>
  </section>

  <section class="card">
    <h2>🤖 Bharat Nova AI</h2>
    <form id="aiForm">
      <input id="aiInput" placeholder="AI से सवाल पूछें..." required>
      <button class="purple" type="submit">AI से पूछें</button>
    </form>
    <div id="aiStatus" class="status hidden"></div>
  </section>

  <section class="card">
    <h2>🔐 Admin Login</h2>
    <p class="small">अपने अधिकृत Firebase अकाउंट से लॉगिन करें।</p>
    <button id="openLoginBtn" type="button">Admin Login खोलें</button>

    <form id="loginForm" class="hidden">
      <input id="adminEmail" type="email" placeholder="Admin Email"
        autocomplete="username" required>
      <input id="adminPassword" type="password" placeholder="Password"
        autocomplete="current-password" required>
      <button id="loginBtn" type="submit">Login</button>
      <button id="closeLoginBtn" class="gray" type="button">बंद करें</button>
    </form>
    <div id="authStatus" class="status">Firebase तैयार हो रहा है...</div>
  </section>

  <section id="adminPanel" class="card hidden">
    <h2>🛡️ Admin Dashboard</h2>
    <p id="adminInfo" class="small"></p>
    <button id="loadUsersBtn" class="green" type="button">
      Firestore Users देखें
    </button>
    <div id="usersStatus" class="status"></div>
    <div id="usersList"></div>
    <button id="logoutBtn" class="red" type="button">Logout</button>
  </section>
</main>

<footer>Bharat Nova © 2026</footer>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA3gjWDlWRFWGTNgPK8nIPGL-2oaVTVtyo",
  authDomain: "bharat-nova-755a8.firebaseapp.com",
  projectId: "bharat-nova-755a8",
  storageBucket: "bharat-nova-755a8.firebasestorage.app",
  messagingSenderId: "68354571415",
  appId: "1:68354571415:web:463bf88d106ca5616d7dd2",
  measurementId: "G-1H75PJM6P6"
};

const ADMIN_EMAIL = "Manmohan595120@gmail.com";
const ADMIN_UID = "lwazyFHIr1h0RPkLWimjjjDwgtL2";
const AI_URL = "https://bharat-nova-ai.manmohan595120.workers.dev/ask";

const $ = id => document.getElementById(id);

function showStatus(id, message) {
  $(id).textContent = message;
  $(id).classList.remove("hidden");
}

/* Search */
$("searchForm").addEventListener("submit", event => {
  event.preventDefault();
  const q = $("searchInput").value.trim();
  if (q) {
    window.location.href =
      "https://www.google.com/search?q=" + encodeURIComponent(q);
  }
});

$("youtubeBtn").addEventListener("click", () => {
  const q = $("searchInput").value.trim();
  if (!q) {
    $("searchInput").focus();
    return;
  }
  window.location.href =
    "https://www.youtube.com/results?search_query=" + encodeURIComponent(q);
});

$("wikiBtn").addEventListener("click", () => {
  const q = $("searchInput").value.trim();
  if (!q) {
    $("searchInput").focus();
    return;
  }
  window.location.href =
    "https://en.wikipedia.org/w/index.php?search=" + encodeURIComponent(q);
});

/* Voice search */
$("voiceBtn").addEventListener("click", () => {
  const Recognition = window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!Recognition) {
    alert("Voice Search के लिए Chrome ब्राउज़र आज़माएँ।");
    return;
  }

  const recognition = new Recognition();
  recognition.lang = "hi-IN";
  recognition.onresult = event => {
    $("searchInput").value = event.results[0][0].transcript;
  };
  recognition.onerror = event => {
    alert("Voice Search Error: " + event.error);
  };
  recognition.start();
});

/* AI */
$("aiForm").addEventListener("submit", async event => {
  event.preventDefault();
  const question = $("aiInput").value.trim();
  if (!question) return;

  showStatus("aiStatus", "AI जवाब तैयार कर रहा है...");

  try {
    const response = await fetch(AI_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question })
    });

    const raw = await response.text();
    if (!response.ok) {
      throw new Error("Server HTTP " + response.status + ": " + raw);
    }

    let data;
    try {
      data = JSON.parse(raw);
    } catch {
      data = { answer: raw };
    }

    $("aiStatus").textContent =
      data.answer ?? data.response ?? data.message ?? raw;
  } catch (error) {
    showStatus("aiStatus", "AI Error: " + error.message);
  }
});

/* Firebase */
let auth = null;
let db = null;
let currentAdmin = null;
let firebaseReady = false;

function isAdmin(user) {
  return Boolean(
    user &&
    user.uid === ADMIN_UID &&
    user.email &&
    user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()
  );
}

function describeError(error) {
  const messages = {
    "auth/invalid-credential": "ईमेल या पासवर्ड गलत है।",
    "auth/invalid-email": "ईमेल का फ़ॉर्मेट गलत है।",
    "auth/operation-not-allowed": "Firebase में Email/Password Sign-in चालू करें।",
    "auth/too-many-requests": "बहुत प्रयास हुए हैं। बाद में कोशिश करें।",
    "auth/network-request-failed": "इंटरनेट कनेक्शन जाँचें।",
    "permission-denied": "Firestore Rules ने अनुमति नहीं दी।"
  };
  return (messages[error.code] || error.message || "अज्ञात Error") +
    (error.code ? "\nCode: " + error.code : "");
}

$("openLoginBtn").addEventListener("click", () => {
  $("loginForm").classList.remove("hidden");
  showStatus("authStatus", "अपना Firebase Email और Password भरें।");
});

$("closeLoginBtn").addEventListener("click", () => {
  $("loginForm").classList.add("hidden");
});

try {
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = getFirestore(app);
  firebaseReady = true;

  onAuthStateChanged(auth, user => {
    if (!user) {
      currentAdmin = null;
      $("adminPanel").classList.add("hidden");
      $("openLoginBtn").classList.remove("hidden");
      showStatus("authStatus", "अभी Admin Login नहीं हुआ है।");
      return;
    }

    if (!isAdmin(user)) {
      currentAdmin = null;
      $("adminPanel").classList.add("hidden");
      showStatus("authStatus",
        "यह अकाउंट Admin के लिए अधिकृत नहीं है।\nUID: " + user.uid);
      signOut(auth).catch(console.error);
      return;
    }

    currentAdmin = user;
    $("adminPanel").classList.remove("hidden");
    $("openLoginBtn").classList.add("hidden");
    $("loginForm").classList.add("hidden");
    $("adminInfo").textContent = "Admin: " + user.email;
    showStatus("authStatus", "Admin Login सफल!");
  });

} catch (error) {
  showStatus("authStatus", "Firebase Initialization Error: " + error.message);
}

/* Login */
$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();

  if (!firebaseReady) {
    showStatus("authStatus", "Firebase तैयार नहीं है। पेज Refresh करें।");
    return;
  }

  $("loginBtn").disabled = true;
  showStatus("authStatus", "Login हो रहा है...");

  try {
    const result = await signInWithEmailAndPassword(
      auth,
      $("adminEmail").value.trim(),
      $("adminPassword").value
    );

    if (!isAdmin(result.user)) {
      showStatus("authStatus",
        "Firebase Login हुआ, लेकिन Admin UID मेल नहीं खाता।\nUID: " +
        result.user.uid);
      await signOut(auth);
      return;
    }

    $("loginForm").reset();
  } catch (error) {
    showStatus("authStatus", "Login Error:\n" + describeError(error));
  } finally {
    $("loginBtn").disabled = false;
  }
});

/* Firestore user status management */
$("loadUsersBtn").addEventListener("click", loadUsers);

async function loadUsers() {
  if (!currentAdmin || !isAdmin(auth.currentUser)) {
    showStatus("usersStatus", "पहले Admin Login करें।");
    return;
  }

  $("usersList").replaceChildren();
  showStatus("usersStatus", "Firestore Users लोड हो रहे हैं...");

  try {
    const snapshot = await getDocs(collection(db, "users"));

    if (snapshot.empty) {
      showStatus("usersStatus", "users collection खाली है।");
      return;
    }

    showStatus("usersStatus", "कुल documents: " + snapshot.size);

    snapshot.forEach(userDoc => {
      const data = userDoc.data();
      const item = document.createElement("div");
      item.className = "user";

      const title = document.createElement("p");
      title.textContent = "Email: " + (data.email || "उपलब्ध नहीं");

      const detail = document.createElement("p");
      detail.textContent = "Document ID: " + userDoc.id +
        "\nStatus: " + (data.blocked ? "Blocked" : "Active");

      const button = document.createElement("button");
      button.className = data.blocked ? "green" : "red";
      button.textContent = data.blocked ? "Unblock Status" : "Block Status";

      button.addEventListener("click", async () => {
        if (!currentAdmin || !isAdmin(auth.currentUser)) return;

        button.disabled = true;

        try {
          await setDoc(doc(db, "users", userDoc.id), {
            blocked: !Boolean(data.blocked),
            statusUpdatedAt: serverTimestamp()
          }, { merge: true });

          await loadUsers();
        } catch (error) {
          showStatus("usersStatus", "Update Error:\n" + describeError(error));
          button.disabled = false;
        }
      });

      item.append(title, detail, button);
      $("usersList").appendChild(item);
    });
  } catch (error) {
    showStatus("usersStatus", "Firestore Error:\n" + describeError(error));
  }
}

/* Logout */
$("logoutBtn").addEventListener("click", async () => {
  try {
    await signOut(auth);
    $("usersList").replaceChildren();
    showStatus("authStatus", "Logout सफल!");
  } catch (error) {
    showStatus("authStatus", "Logout Error: " + describeError(error));
  }
});
</script>
</body>
</html>
